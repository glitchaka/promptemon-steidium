name: Build Windows demo

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-demo-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target promptemon_demo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force demo | Out-Null
          Copy-Item build/Release/promptemon_demo.exe demo/
          @"
          PROMPTEMON STEIDIUM - playable prototype

          Current playable flow:
          1. Nueva partida
          2. Introduccion
          3. Choose Rattata, Pidgey or Caterpie
          4. Enter Proto Hub
          5. Go to Zona de Caza
          6. See the wild Pokemon, its IV training reward and possible shiny state
          7. Fight a complete turn-based battle
          8. Winning grants XP and can improve the indicated IV

          Notes:
          - Load/Delete/Export are intentionally disabled in this cut.
          - Shiny wild Pokemon use a 1/4096 prototype roll.
          - The old ROM/BCH 3D viewer remains in the source as the promptemon_viewer target.
          - ROM models are not yet wired into the battle screen in this logic-first cut.
          "@ | Set-Content demo/README.txt

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: promptemon-steidium-demo-windows
          path: demo/
          if-no-files-found: error
