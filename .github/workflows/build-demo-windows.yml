name: Build Windows demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target promptemon_demo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force demo | Out-Null
          Copy-Item build/Release/promptemon_demo.exe demo/
          @"
          PROMPTEMON STEIDIUM - stage scene

          Place the installed Rumble World bundle beside the executable at assets/resources-tx.
          This build contains no prototype menu, HUD or invented gameplay layer: it renders one complete stage at full scene scale.
          "@ | Set-Content demo/README.txt

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: promptemon-steidium-demo-windows
          path: demo/
          if-no-files-found: error
