name: Build Windows demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target promptemon_demo

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force demo | Out-Null
          Copy-Item build/Release/promptemon_demo.exe demo/
          @"
          PROMPTEMON STEIDIUM - playable prototype

          Put your own Pokemon Rumble World ROM inside a 'roms' folder next to the executable.
          The playable prototype now reads and renders the ROM models directly in Hub, Hunt and Battle.

          Current flow:
          Nueva partida -> Introduccion -> starter -> Hub -> Caza -> Combate.
          "@ | Set-Content demo/README.txt

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: promptemon-steidium-demo-windows
          path: demo/
          if-no-files-found: error
